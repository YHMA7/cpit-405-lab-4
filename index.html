<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 4: Auto Parts Order Form</title>
    <style>
        /* Page layout */
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        /* Container form styling */
        .order-form {
            width: 100%;
            max-width: 520px;
        }

        /* Main title */
        h1 {
            text-align: center;
            font-family: "Times New Roman", Times, serif;
            font-size: 32px;
            margin-bottom: 25px;
            color: #000;
        }

        /* Input field groups */
        .form-group {
            margin-bottom: 14px;
        }

        /* Labels styling */
        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
            color: #222;
        }

        /* Inputs and textarea styling */
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #c8c8c8;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            color: #333;
        }

        /* Placeholder text color */
        input::placeholder,
        textarea::placeholder {
            color: #8c8c8c;
            font-size: 13px;
        }

        /* Focus state */
        input:focus,
        textarea:focus {
            border-color: #666;
        }

        /* Textarea dimensions */
        textarea {
            height: 160px;
            resize: vertical;
        }

        /* Submit button styling */
        .submit-btn {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }

        .submit-btn:hover {
            background-color: #222222;
        }
    </style>
</head>
<body>

    <form class="order-form">
        <!-- Main Form Heading -->
        <h1>Great Auto Parts - Order Form</h1>

        <!-- First Name -->
        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" placeholder="Enter your first name">
        </div>

        <!-- Last Name -->
        <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" placeholder="Enter your last name">
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address">
        </div>

        <!-- Phone number -->
        <div class="form-group">
            <label for="phone">Phone number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
        </div>

        <!-- Make -->
        <div class="form-group">
            <label for="make">Make:</label>
            <input type="text" id="make" name="make" placeholder="Make">
        </div>

        <!-- Model -->
        <div class="form-group">
            <label for="model">Model:</label>
            <input type="text" id="model" name="model" placeholder="Model">
        </div>

        <!-- Year -->
        <div class="form-group">
            <label for="year">Year:</label>
            <input type="number" id="year" name="year" placeholder="Year">
        </div>

        <!-- Date -->
        <div class="form-group">
            <label for="orderDate">Date:</label>
            <input type="date" id="orderDate" name="orderDate">
        </div>

        <!-- Spare Part -->
        <div class="form-group">
            <label for="sparePart">Spare Part:</label>
            <input type="text" id="sparePart" name="sparePart" placeholder="Enter the spare part you need">
        </div>

        <!-- Quantity -->
        <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" placeholder="Enter the quantity of the spare part you need">
        </div>

        <!-- Comment -->
        <div class="form-group">
            <label for="comment">Comment:</label>
            <textarea id="comment" name="comment" placeholder="Enter your comment"></textarea>
        </div>

        <!-- Submit Button -->
        <input type="submit" value="Submit" class="submit-btn">
    </form>

</body>
</html>
